name: Build Begonia Kernel

on:
  push:
    branches:
      - Suzaku-bka
      - main
      - master
  pull_request:
    branches:
      - Suzaku-bka
      - main
      - master
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to use'
        required: false
        default: 'begonia_user_defconfig'
        type: choice
        options:
          - begonia_user_defconfig
      cross_compile:
        description: 'Cross compiler prefix'
        required: false
        default: 'aarch64-linux-gnu-'

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: begonia_user_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  CC: clang
  LLVM: 1
  BUILD_DIR: out

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Initialize KernelSU submodule
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive KernelSU
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-18 \
            lld \
            llvm-18 \
            ccache \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            dwarves \
            pkg-config \
            libncurses-dev \
            zip
          # Use unversioned LLVM tool names (clang, ld.lld, llvm-ar, ...)
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          # Compiler + defconfig in the key: a new toolchain or config change
          # must not reuse stale objects. Fall back to newest ccache of same OS.
          key: ccache-${{ runner.os }}-clang18-${{ hashFiles('arch/arm64/configs/begonia_user_defconfig') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang18-${{ hashFiles('arch/arm64/configs/begonia_user_defconfig') }}-
            ccache-${{ runner.os }}-clang18-

      - name: Configure ccache
        run: |
          ccache --set-config=sloppiness=file_macro,include_file_mtime,include_file_ctime,time_macros,pch_defines,random_seed
          ccache --set-config=hash_dir=false
          ccache --max-size=2G
          ccache -z

      - name: Verify Clang compiler
        run: |
          which clang
          clang --version | head -1
          echo "Using CLANG_TRIPLE=${CLANG_TRIPLE}"

      - name: Verify cross-compiler
        run: |
          ${CROSS_COMPILE}gcc --version
          echo "Using CROSS_COMPILE=${CROSS_COMPILE}"

      - name: Clean build directory
        run: |
          if [ -d "${{ env.BUILD_DIR }}" ]; then
            make O="${{ env.BUILD_DIR }}" mrproper
          fi
          mkdir -p "${{ env.BUILD_DIR }}"

      - name: Backport fixes onto KernelSU-Next (arm64 compat)
        run: |
          # KSUN targets GKI/5.x; begonia is 4.14 arm64. Three patches applied
          # to the submodule checkout at build time so the pin stays pristine.
          python3 - <<'PY'
          p = 'KernelSU/kernel/hook/syscall_hook.h'
          t = open(p).read()
          old = '#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n#endif'
          new = ('#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n'
                 '#elif defined(__aarch64__)\n'
                 'typedef long (*syscall_fn_t)(const struct pt_regs *regs);\n'
                 '#else\n'
                 'typedef long (*syscall_fn_t)(const struct pt_regs *regs);\n'
                 '#endif')
          assert old in t, 'syscall_hook.h pattern not found'
          open(p, 'w').write(t.replace(old, new))
          print('syscall_fn_t backport applied')

          p = 'KernelSU/kernel/feature/sucompat.c'
          t = open(p).read()
          old = '#include <linux/pgtable.h>\n'
          assert old in t, 'sucompat.c pgtable include not found'
          open(p, 'w').write(t.replace(old, '#include <linux/version.h>\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)\n#include <linux/pgtable.h>\n#endif\n'))
          print('pgtable.h backport applied')

          p = 'KernelSU/kernel/hook/syscall_event_bridge.c'
          t = open(p).read()
          old = '#include <linux/static_key.h>\n'
          assert old in t, 'syscall_event_bridge.c static_key include not found'
          open(p, 'w').write(t.replace(old, old + '#include <linux/uaccess.h>\n'))
          print('uaccess.h backport applied')
          PY

      - name: Configure kernel
        run: |
          # Copy defconfig
          if [ -f "arch/arm64/configs/${{ env.DEFCONFIG }}" ]; then
            cp "arch/arm64/configs/${{ env.DEFCONFIG }}" "${{ env.BUILD_DIR }}/.config"
          else
            echo "Defconfig ${{ env.DEFCONFIG }} not found!"
            exit 1
          fi
          
          # Ensure the KernelSU/SUSFS prerequisites are present. Exact-match greps
          # only: a substring grep is fooled by lines like CONFIG_KSU_SUSFS=yFOO=y,
          # and if a dependency is missing (KSU needs KPROBES && EXT4_FS) Kconfig
          # silently drops these symbols -> a kernel with no KernelSU and no SUSFS.
          ksu_cfg="${{ env.BUILD_DIR }}/.config"
          for sym in CONFIG_MODULES=y CONFIG_KPROBES=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y \
                     CONFIG_EXT4_FS=y CONFIG_KSU=y CONFIG_KSU_SUSFS=y \
                     CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                     CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
                     CONFIG_KSU_SUSFS_SPOOF_UNAME=y CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
                     CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_KSU_SUSFS_ENABLE_LOG=y; do
            grep -qx "$sym" "$ksu_cfg" || echo "$sym" >> "$ksu_cfg"
          done

          # Run olddefconfig
          make O="${{ env.BUILD_DIR }}" \
               ARCH=${{ env.ARCH }} \
               SUBARCH=${{ env.SUBARCH }} \
               CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
               olddefconfig

          # Fail loudly if Kconfig dropped any of them after resolution
          for sym in CONFIG_MODULES=y CONFIG_KPROBES=y CONFIG_KALLSYMS_ALL=y CONFIG_EXT4_FS=y \
                     CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y \
                     CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y \
                     CONFIG_KSU_SUSFS_TRY_UMOUNT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
                     CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
                     CONFIG_KSU_SUSFS_OPEN_REDIRECT=y; do
            if ! grep -qx "$sym" "$ksu_cfg"; then
              echo "::error::$sym is missing from $ksu_cfg after olddefconfig - KernelSU/SUSFS would not be built"
              exit 1
            fi
          done
          echo "KernelSU/SUSFS config verified:"
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|KALLSYMS|KALLSYMS_ALL|EXT4_FS|MODULES)=' "$ksu_cfg"

      - name: Build kernel
        env:
          CC: "ccache clang"
        run: |
          make O="${{ env.BUILD_DIR }}" \
               ARCH=${{ env.ARCH }} \
               SUBARCH=${{ env.SUBARCH }} \
               CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
               -j$(nproc) \
               dtbs \
               Image.gz-dtb \
               modules
          echo "=== ccache stats ==="
          ccache -s || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-clang18-${{ hashFiles('arch/arm64/configs/begonia_user_defconfig') }}-${{ github.sha }}

      - name: Show build output
        run: |
          echo "=== Build Output ==="
          ls -lh "${{ env.BUILD_DIR }}/arch/arm64/boot/" 2>/dev/null || true
          echo ""
          echo "=== Build Stats ==="
          du -sh "${{ env.BUILD_DIR }}" 2>/dev/null || true

      - name: Verify KernelSU and SUSFS are in the kernel
        run: |
          map="${{ env.BUILD_DIR }}/System.map"
          if [ ! -f "$map" ]; then
            echo "::error::$map not found"
            exit 1
          fi
          ksu_count=$(grep -c ' ksu_' "$map" || true)
          susfs_count=$(grep -c 'susfs' "$map" || true)
          echo "KernelSU symbols: $ksu_count, SUSFS symbols: $susfs_count"
          if [ "$ksu_count" -lt 5 ]; then
            echo "::error::KernelSU symbols missing from $map - CONFIG_KSU did not build"
            exit 1
          fi
          if [ "$susfs_count" -lt 5 ]; then
            echo "::error::SUSFS symbols missing from $map - CONFIG_KSU_SUSFS did not build"
            exit 1
          fi
          grep -E ' ksu_(handle_execveat|handle_faccessat|handle_stat|handle_vfs_read)$' "$map" || true

      - name: Package TWRP flashable AnyKernel3 zip
        run: |
          mkdir -p build_output
          if [ ! -f "${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "::warning::No Image.gz-dtb found, skipping AnyKernel3 packaging"
            exit 0
          fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp "${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz-dtb" AnyKernel3/Image.gz-dtb
          # begonia's boot image ships Image.gz-dtb (kernel.gz + appended mediatek/mt6785 dtb).
          # AK3 auto-detects the kernel file by name; Image.gz-dtb keeps the appended DTB.
          # Replace template anykernel.sh with begonia config (based on requiredroot/powa_karnal)
          cat > AnyKernel3/anykernel.sh <<'AK3EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          
          ## AnyKernel setup
          properties() { '
          kernel.string=Suzaku Kernel V2 for Redmi Note 8 Pro (begonia)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=begonia
          device.name2=begonia_in
          device.name3=begoniain
          device.name4=
          supported.versions=
          supported.patchlevels=
          '; } # end properties
          
          ## shell variables
          BLOCK=/dev/block/by-name/boot;
          # begonia (Redmi Note 8 Pro) is an A-only device: a single boot partition,
          # no A/B slot suffix. Keep IS_SLOT_DEVICE=0 (AnyKernel3 default for A-only).
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;
          
          ## AnyKernel file attributes
          # set permissions/ownership for included ramdisk files
          chmod -R 750 $RAMDISK/*;
          chown -R root:root $RAMDISK/*;
          
          ## AnyKernel install
          dump_boot;
          
          write_boot;
          
          ## end install
          AK3EOF
          AK3_NAME="SuzakuKernel-begonia-$(date +%Y%m%d-%H%M%S)-AnyKernel3.zip"
          (cd AnyKernel3 && zip -r9 "../build_output/$AK3_NAME" . -x '.git/*' '.gitignore' '.github/*')
          echo "Created build_output/$AK3_NAME"

      - name: Verify AnyKernel3 zip (payload + begonia config)
        run: |
          zipfile=$(ls build_output/*AnyKernel3.zip | head -n1)
          if [ -z "$zipfile" ]; then
            echo "::error::No AnyKernel3 zip to verify"
            exit 1
          fi
          bash verify_ak3_zip.sh "$zipfile"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3
          path: build_output/*AnyKernel3.zip
          retention-days: 30

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: ${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz-dtb
          retention-days: 30

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: dtbs
          path: ${{ env.BUILD_DIR }}/arch/arm64/boot/dts/
          retention-days: 30

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: ${{ env.BUILD_DIR }}/modules/
          retention-days: 30

      - name: Package build artifacts
        if: always()
        run: |
          mkdir -p build_output
          package_name="begonia-kernel-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "build_output/$package_name"
          
          # Copy kernel image (begonia boots Image.gz-dtb: kernel.gz + appended mt6785 dtb)
          if [ -f "${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${{ env.BUILD_DIR }}/arch/arm64/boot/Image.gz-dtb" "build_output/$package_name/"
          fi
          
          # Copy DTBs
          if [ -d "${{ env.BUILD_DIR }}/arch/arm64/boot/dts" ]; then
            cp -r "${{ env.BUILD_DIR }}/arch/arm64/boot/dts" "build_output/$package_name/"
          fi
          
          # Copy modules
          if [ -d "${{ env.BUILD_DIR }}/modules" ]; then
            cp -r "${{ env.BUILD_DIR }}/modules" "build_output/$package_name/"
          fi
          
          # Create manifest
          echo "Kernel Build Manifest" > "build_output/$package_name/MANIFEST.txt"
          echo "=====================" >> "build_output/$package_name/MANIFEST.txt"
          echo "Date: $(date -u)" >> "build_output/$package_name/MANIFEST.txt"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)" >> "build_output/$package_name/MANIFEST.txt"
          echo "Commit: $(git rev-parse HEAD)" >> "build_output/$package_name/MANIFEST.txt"
          echo "KernelSU Commit: $(cd KernelSU && git rev-parse HEAD 2>/dev/null || echo \"N/A\")" >> "build_output/$package_name/MANIFEST.txt"
          echo "Config: ${{ env.DEFCONFIG }}" >> "build_output/$package_name/MANIFEST.txt"
          echo "ARCH: ${{ env.ARCH }}" >> "build_output/$package_name/MANIFEST.txt"
          echo "CROSS_COMPILE: ${{ env.CROSS_COMPILE }}" >> "build_output/$package_name/MANIFEST.txt"
          echo "GitHub Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "build_output/$package_name/MANIFEST.txt"
          
          # Create tarball
          cd build_output
          tar -czf "${package_name}.tar.gz" "$package_name"
          cd ..
          
          echo "Package: ${package_name}.tar.gz"

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: build_output/*.tar.gz
          retention-days: 30

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build_output/*.tar.gz
            build_output/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
